<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- title -->
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">Scale tap to ESP32 via SN74LVC2G17</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#546E7A">A copy of the scale A/B is buffered to 3.3V. The existing DRO path is unchanged.</text>

  <!-- +3.3V rail -->
  <line x1="360" y1="96" x2="765" y2="96" stroke="#C62828" stroke-width="2.5"/>
  <text x="360" y="88" font-size="12" fill="#C62828" font-weight="bold">+3.3V  (from ESP32 3V3 / board rail)</text>

  <!-- GND rail -->
  <line x1="110" y1="440" x2="905" y2="440" stroke="#263238" stroke-width="2.5"/>
  <text x="110" y="460" font-size="12" fill="#263238" font-weight="bold">GND (0V), common to scale/DRO, buffer, ESP32</text>

  <!-- ===== Scale + DRO box ===== -->
  <rect x="60" y="150" width="210" height="255" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.5"/>
  <text x="165" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Existing scale + DRO</text>
  <text x="165" y="197" text-anchor="middle" font-size="11" fill="#546E7A">(unchanged: DRO powers</text>
  <text x="165" y="211" text-anchor="middle" font-size="11" fill="#546E7A">and reads the scale)</text>
  <text x="76" y="254" font-size="12" fill="#1565C0" font-weight="bold">A  = DB9 pin 6 (5V TTL), tapped</text>
  <text x="76" y="304" font-size="12" fill="#1565C0" font-weight="bold">B  = DB9 pin 8 (5V TTL), tapped</text>
  <text x="76" y="348" font-size="12" fill="#263238" font-weight="bold">GND = DB9 pin 2, tapped</text>
  <text x="76" y="374" font-size="11" fill="#90A4AE">DB9 pin 5: unknown, passes</text>
  <text x="76" y="388" font-size="11" fill="#90A4AE">straight through to DRO (not tapped)</text>

  <!-- tap nodes on right edge -->
  <circle cx="270" cy="250" r="3.5" fill="#1565C0"/>
  <circle cx="270" cy="300" r="3.5" fill="#1565C0"/>
  <circle cx="270" cy="348" r="3.5" fill="#263238"/>

  <!-- ===== shield around the tap cable ===== -->
  <rect x="288" y="228" width="170" height="150" rx="6" fill="none" stroke="#7B1FA2" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="300" y="400" font-size="11" fill="#7B1FA2">Shielded cable, shield to 0V at board end only</text>
  <!-- shield drain to GND at board (buffer) end -->
  <line x1="452" y1="378" x2="452" y2="415" stroke="#7B1FA2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="452" y1="415" x2="452" y2="440" stroke="#263238" stroke-width="1.3"/>
  <circle cx="452" cy="415" r="3" fill="#7B1FA2"/>

  <!-- ===== SN74LVC2G17 IC ===== -->
  <rect x="470" y="150" width="190" height="255" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.8"/>
  <text x="565" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">SN74LVC2G17</text>
  <text x="565" y="223" text-anchor="middle" font-size="11" fill="#546E7A">dual Schmitt buffer</text>

  <!-- pin labels (SOT-23-6) -->
  <text x="478" y="254" font-size="11.5" fill="#263238">1: 1A (in)</text>
  <text x="478" y="304" font-size="11.5" fill="#263238">3: 2A (in)</text>
  <text x="652" y="254" text-anchor="end" font-size="11.5" fill="#263238">1Y (out) :6</text>
  <text x="652" y="304" text-anchor="end" font-size="11.5" fill="#263238">2Y (out) :4</text>
  <text x="565" y="172" text-anchor="middle" font-size="11.5" fill="#263238">5: VCC</text>
  <text x="565" y="396" text-anchor="middle" font-size="11.5" fill="#263238">2: GND</text>

  <!-- pin nodes -->
  <circle cx="470" cy="250" r="3.5" fill="#1565C0"/>
  <circle cx="470" cy="300" r="3.5" fill="#1565C0"/>
  <circle cx="660" cy="250" r="3.5" fill="#2E7D32"/>
  <circle cx="660" cy="300" r="3.5" fill="#2E7D32"/>
  <circle cx="565" cy="150" r="3.5" fill="#C62828"/>
  <circle cx="565" cy="405" r="3.5" fill="#263238"/>

  <!-- ===== ESP32 box ===== -->
  <rect x="790" y="175" width="140" height="180" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.5"/>
  <text x="860" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">ESP32</text>
  <text x="800" y="255" font-size="12" fill="#2E7D32" font-weight="bold">GPIO32 (Quad A)</text>
  <text x="800" y="305" font-size="12" fill="#2E7D32" font-weight="bold">GPIO33 (Quad B)</text>
  <circle cx="790" cy="250" r="3.5" fill="#2E7D32"/>
  <circle cx="790" cy="300" r="3.5" fill="#2E7D32"/>

  <!-- ===== signal wires ===== -->
  <line x1="270" y1="250" x2="470" y2="250" stroke="#1565C0" stroke-width="2"/>
  <text x="370" y="243" text-anchor="middle" font-size="11" fill="#1565C0">A (5V)</text>
  <line x1="270" y1="300" x2="470" y2="300" stroke="#1565C0" stroke-width="2"/>
  <text x="370" y="293" text-anchor="middle" font-size="11" fill="#1565C0">B (5V)</text>
  <line x1="660" y1="250" x2="790" y2="250" stroke="#2E7D32" stroke-width="2"/>
  <text x="725" y="243" text-anchor="middle" font-size="11" fill="#2E7D32">3.3V</text>
  <line x1="660" y1="300" x2="790" y2="300" stroke="#2E7D32" stroke-width="2"/>
  <text x="725" y="293" text-anchor="middle" font-size="11" fill="#2E7D32">3.3V</text>

  <!-- VCC up to rail -->
  <line x1="565" y1="150" x2="565" y2="96" stroke="#C62828" stroke-width="2"/>
  <!-- pin2 GND down to rail -->
  <line x1="565" y1="405" x2="565" y2="440" stroke="#263238" stroke-width="2"/>
  <!-- scale GND down to rail -->
  <line x1="270" y1="348" x2="270" y2="440" stroke="#263238" stroke-width="2"/>
  <!-- ESP GND down to rail -->
  <line x1="860" y1="355" x2="860" y2="440" stroke="#263238" stroke-width="2"/>

  <!-- junction dots on GND rail -->
  <circle cx="270" cy="440" r="3.5" fill="#263238"/>
  <circle cx="452" cy="440" r="3.5" fill="#263238"/>
  <circle cx="565" cy="440" r="3.5" fill="#263238"/>
  <circle cx="860" cy="440" r="3.5" fill="#263238"/>

  <!-- ===== decoupling cap ===== -->
  <text x="688" y="150" font-size="12" fill="#263238" font-weight="bold">0.1 uF decoupling</text>
  <text x="688" y="166" font-size="11" fill="#546E7A">mount at pins 5 (VCC) and 2 (GND)</text>
  <line x1="740" y1="96" x2="740" y2="185" stroke="#C62828" stroke-width="2"/>
  <circle cx="740" cy="96" r="3.5" fill="#C62828"/>
  <line x1="722" y1="185" x2="758" y2="185" stroke="#263238" stroke-width="2.5"/>
  <line x1="722" y1="195" x2="758" y2="195" stroke="#263238" stroke-width="2.5"/>
  <line x1="740" y1="195" x2="740" y2="215" stroke="#263238" stroke-width="2"/>
  <text x="700" y="234" font-size="11" fill="#546E7A">to GND</text>

  <!-- ===== notes ===== -->
  <rect x="60" y="475" width="560" height="110" rx="6" fill="#F5F7F8" stroke="#CFD8DC" stroke-width="1"/>
  <text x="74" y="497" font-size="12" font-weight="bold" fill="#263238">Notes</text>
  <text x="74" y="517" font-size="11.5" fill="#37474F">- Both gates used: gate 1 = A, gate 2 = B.</text>
  <text x="74" y="535" font-size="11.5" fill="#37474F">- LVC input is 5V-tolerant, so the 5V scale signal is safe on 3.3V VCC.</text>
  <text x="74" y="553" font-size="11.5" fill="#37474F">- Powered from 3.3V, so the outputs are clean 3.3V logic.</text>
  <text x="74" y="571" font-size="11.5" fill="#37474F">- Schmitt hysteresis rejects noise and squares slow edges.</text>
</svg>
