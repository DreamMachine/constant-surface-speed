<svg viewBox="0 0 1012 712" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1012" height="712" fill="#ffffff"/>

  <!-- title -->
  <text x="506" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">Scale tap to ESP32 via CA-IS3720LS</text>
  <text x="506" y="56" text-anchor="middle" font-size="13" fill="#546E7A">A copy of the scale A/B is isolated and shifted to 3.3V. The existing DRO path is unchanged.</text>

  <!-- ===== the two sides and the isolation barrier ===== -->
  <rect x="20" y="90" width="501" height="462" rx="8" fill="#F3F7FC"/>
  <rect x="539" y="90" width="453" height="462" rx="8" fill="#F2F8F3"/>
  <text x="34" y="108" font-size="11" font-weight="bold" letter-spacing="1" fill="#5B7FA6">DRO SIDE</text>
  <text x="978" y="108" text-anchor="end" font-size="11" font-weight="bold" letter-spacing="1" fill="#5E8F63">CONTROLLER SIDE</text>
  <text x="530" y="80" text-anchor="middle" font-size="11" font-weight="bold" letter-spacing="1" fill="#455A64">ISOLATION BARRIER</text>

  <!-- +5V rail (DRO side) -->
  <polyline points="270,279 288,279 288,136 475,136" fill="none" stroke="#E65100" stroke-width="2.5"/>
  <text x="296" y="128" font-size="12" fill="#E65100" font-weight="bold">+5V from the DRO (DB9 pin 7)</text>

  <!-- +3.3V rail (controller side) -->
  <polyline points="585,136 914,136 914,235" fill="none" stroke="#C62828" stroke-width="2.5"/>
  <text x="593" y="128" font-size="12" fill="#C62828" font-weight="bold">+3.3V from controller</text>

  <!-- DRO 0V rail -->
  <polyline points="270,388 288,388 288,498 475,498" fill="none" stroke="#263238" stroke-width="2.5"/>
  <text x="296" y="518" font-size="12" fill="#263238" font-weight="bold">DRO 0V (DB9 pin 2)</text>
  <text x="296" y="536" font-size="11" fill="#546E7A">scale, DRO and isolator input side</text>

  <!-- controller GND rail -->
  <polyline points="585,498 914,498 914,415" fill="none" stroke="#263238" stroke-width="2.5"/>
  <text x="593" y="518" font-size="12" fill="#263238" font-weight="bold">Controller GND</text>

  <!-- ===== Scale + DRO box ===== -->
  <rect x="30" y="200" width="240" height="255" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.5"/>
  <text x="150" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">Existing scale + DRO</text>
  <text x="150" y="247" text-anchor="middle" font-size="11" fill="#546E7A">(unchanged: DRO powers</text>
  <text x="150" y="261" text-anchor="middle" font-size="11" fill="#546E7A">and reads the scale)</text>
  <text x="46" y="283" font-size="12" fill="#E65100" font-weight="bold">+5V = DB9 pin 7, tapped</text>
  <text x="46" y="314" font-size="12" fill="#1565C0" font-weight="bold">A  = DB9 pin 6 (5V TTL), tapped</text>
  <text x="46" y="354" font-size="12" fill="#1565C0" font-weight="bold">B  = DB9 pin 8 (5V TTL), tapped</text>
  <text x="46" y="392" font-size="12" fill="#263238" font-weight="bold">0V = DB9 pin 2, tapped</text>
  <text x="46" y="419" font-size="11" fill="#90A4AE">DB9 pin 5: unknown, passes</text>
  <text x="46" y="433" font-size="11" fill="#90A4AE">straight through to DRO (not tapped)</text>

  <!-- tap nodes on right edge -->
  <circle cx="270" cy="279" r="3.5" fill="#E65100"/>
  <circle cx="270" cy="310" r="3.5" fill="#1565C0"/>
  <circle cx="270" cy="350" r="3.5" fill="#1565C0"/>
  <circle cx="270" cy="388" r="3.5" fill="#263238"/>

  <!-- ===== CA-IS3720LS ===== -->
  <rect x="420" y="200" width="220" height="255" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.8"/>

  <!-- barrier: grey band between the two sides, dashed line through the chip -->
  <rect x="521" y="90" width="18" height="462" fill="#ECEFF1"/>
  <line x1="520" y1="200" x2="540" y2="200" stroke="#37474F" stroke-width="1.8"/>
  <line x1="520" y1="455" x2="540" y2="455" stroke="#37474F" stroke-width="1.8"/>
  <line x1="530" y1="94" x2="530" y2="238" stroke="#607D8B" stroke-width="1.6" stroke-dasharray="7 5"/>
  <line x1="530" y1="288" x2="530" y2="548" stroke="#607D8B" stroke-width="1.6" stroke-dasharray="7 5"/>

  <text x="530" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">CA-IS3720LS</text>
  <text x="530" y="276" text-anchor="middle" font-size="11" fill="#546E7A">2-channel digital isolator</text>

  <!-- pin labels (SOIC-8) -->
  <text x="475" y="222" text-anchor="middle" font-size="11.5" fill="#263238">1: VDDA</text>
  <text x="585" y="222" text-anchor="middle" font-size="11.5" fill="#263238">8: VDDB</text>
  <text x="428" y="314" font-size="11.5" fill="#263238">2: VI1</text>
  <text x="428" y="354" font-size="11.5" fill="#263238">3: VI2</text>
  <text x="632" y="314" text-anchor="end" font-size="11.5" fill="#263238">VO1 :7</text>
  <text x="632" y="354" text-anchor="end" font-size="11.5" fill="#263238">VO2 :6</text>
  <text x="475" y="446" text-anchor="middle" font-size="11.5" fill="#263238">4: GNDA</text>
  <text x="585" y="446" text-anchor="middle" font-size="11.5" fill="#263238">5: GNDB</text>

  <!-- signal direction through the barrier -->
  <line x1="472" y1="310" x2="519" y2="310" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="541" y1="310" x2="578" y2="310" stroke="#90A4AE" stroke-width="1.5"/>
  <path d="M 578 305.5 L 587 310 L 578 314.5 Z" fill="#90A4AE"/>
  <line x1="472" y1="350" x2="519" y2="350" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="541" y1="350" x2="578" y2="350" stroke="#90A4AE" stroke-width="1.5"/>
  <path d="M 578 345.5 L 587 350 L 578 354.5 Z" fill="#90A4AE"/>

  <!-- pin nodes -->
  <circle cx="420" cy="310" r="3.5" fill="#1565C0"/>
  <circle cx="420" cy="350" r="3.5" fill="#1565C0"/>
  <circle cx="640" cy="310" r="3.5" fill="#2E7D32"/>
  <circle cx="640" cy="350" r="3.5" fill="#2E7D32"/>
  <circle cx="475" cy="200" r="3.5" fill="#E65100"/>
  <circle cx="585" cy="200" r="3.5" fill="#C62828"/>
  <circle cx="475" cy="455" r="3.5" fill="#263238"/>
  <circle cx="585" cy="455" r="3.5" fill="#263238"/>

  <!-- supply and ground pins to their rails -->
  <line x1="475" y1="200" x2="475" y2="136" stroke="#E65100" stroke-width="2"/>
  <line x1="585" y1="200" x2="585" y2="136" stroke="#C62828" stroke-width="2"/>
  <line x1="475" y1="455" x2="475" y2="498" stroke="#263238" stroke-width="2"/>
  <line x1="585" y1="455" x2="585" y2="498" stroke="#263238" stroke-width="2"/>

  <!-- ===== ESP32 box ===== -->
  <rect x="850" y="235" width="128" height="180" rx="8" fill="#ffffff" stroke="#37474F" stroke-width="1.5"/>
  <text x="914" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">ESP32</text>
  <text x="914" y="282" text-anchor="middle" font-size="11" fill="#546E7A">(controller board)</text>
  <text x="860" y="315" font-size="12" fill="#2E7D32" font-weight="bold">GPIO26 (Quad A)</text>
  <text x="860" y="355" font-size="12" fill="#2E7D32" font-weight="bold">GPIO27 (Quad B)</text>
  <circle cx="850" cy="310" r="3.5" fill="#2E7D32"/>
  <circle cx="850" cy="350" r="3.5" fill="#2E7D32"/>
  <circle cx="914" cy="235" r="3.5" fill="#C62828"/>
  <circle cx="914" cy="415" r="3.5" fill="#263238"/>

  <!-- ===== signal wires ===== -->
  <line x1="270" y1="310" x2="420" y2="310" stroke="#1565C0" stroke-width="2"/>
  <rect x="342" y="303" width="44" height="14" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="364" y="298" text-anchor="middle" font-size="11" fill="#1565C0">1 k&#937;</text>
  <text x="317" y="303" text-anchor="middle" font-size="11" fill="#1565C0">A (5V)</text>
  <line x1="640" y1="310" x2="850" y2="310" stroke="#2E7D32" stroke-width="2"/>
  <rect x="660" y="303" width="44" height="14" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="682" y="298" text-anchor="middle" font-size="11" fill="#2E7D32">33 &#937;</text>
  <text x="790" y="303" text-anchor="middle" font-size="11" fill="#2E7D32">A (3.3V)</text>
  <line x1="270" y1="350" x2="420" y2="350" stroke="#1565C0" stroke-width="2"/>
  <rect x="342" y="343" width="44" height="14" fill="#ffffff" stroke="#1565C0" stroke-width="2"/>
  <text x="364" y="338" text-anchor="middle" font-size="11" fill="#1565C0">1 k&#937;</text>
  <text x="317" y="343" text-anchor="middle" font-size="11" fill="#1565C0">B (5V)</text>
  <line x1="640" y1="350" x2="850" y2="350" stroke="#2E7D32" stroke-width="2"/>
  <rect x="660" y="343" width="44" height="14" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
  <text x="682" y="338" text-anchor="middle" font-size="11" fill="#2E7D32">33 &#937;</text>
  <text x="790" y="343" text-anchor="middle" font-size="11" fill="#2E7D32">B (3.3V)</text>

  <!-- ===== decoupling capacitors, one each side ===== -->
  <line x1="382" y1="136" x2="382" y2="156" stroke="#E65100" stroke-width="2"/>
  <circle cx="382" cy="136" r="3.5" fill="#E65100"/>
  <line x1="364" y1="156" x2="400" y2="156" stroke="#263238" stroke-width="2.5"/>
  <line x1="364" y1="166" x2="400" y2="166" stroke="#263238" stroke-width="2.5"/>
  <line x1="382" y1="166" x2="382" y2="180" stroke="#263238" stroke-width="2"/>
  <text x="382" y="194" text-anchor="middle" font-size="11" fill="#263238" font-weight="bold">100 nF</text>
  <text x="382" y="208" text-anchor="middle" font-size="11" fill="#546E7A">to DRO 0V</text>
  <line x1="690" y1="136" x2="690" y2="156" stroke="#C62828" stroke-width="2"/>
  <circle cx="690" cy="136" r="3.5" fill="#C62828"/>
  <line x1="672" y1="156" x2="708" y2="156" stroke="#263238" stroke-width="2.5"/>
  <line x1="672" y1="166" x2="708" y2="166" stroke="#263238" stroke-width="2.5"/>
  <line x1="690" y1="166" x2="690" y2="180" stroke="#263238" stroke-width="2"/>
  <text x="690" y="194" text-anchor="middle" font-size="11" fill="#263238" font-weight="bold">100 nF + 1 &#181;F</text>
  <text x="690" y="208" text-anchor="middle" font-size="11" fill="#546E7A">to GND</text>

  <!-- ===== shielded cable between the tap board and the controller ===== -->
  <rect x="752" y="118" width="76" height="394" rx="6" fill="none" stroke="#7B1FA2" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="593" y="536" font-size="11" fill="#7B1FA2">Shielded cable (3V3, A, B, GND). Shield to GND at controller end only.</text>
  <!-- shield drain to GND at the controller end -->
  <polyline points="828,474 839,474 839,498" fill="none" stroke="#7B1FA2" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="828" cy="474" r="3" fill="#7B1FA2"/>
  <circle cx="839" cy="498" r="3.5" fill="#263238"/>

  <!-- ===== notes ===== -->
  <rect x="30" y="568" width="952" height="128" rx="6" fill="#F5F7F8" stroke="#CFD8DC" stroke-width="1"/>
  <text x="46" y="590" font-size="12" font-weight="bold" fill="#263238">Notes</text>
  <text x="46" y="610" font-size="11.5" fill="#37474F">- Input side runs from the DRO's own 5V, so the 5V scale signals are inside its input range.</text>
  <text x="46" y="628" font-size="11.5" fill="#37474F">- Output side runs from the controller's 3.3V, so the ESP32 gets clean 3.3V logic.</text>
  <text x="46" y="646" font-size="11.5" fill="#37474F">- The DRO and the controller share no ground, so there is no ground loop between them.</text>
  <text x="46" y="664" font-size="11.5" fill="#37474F">- 1 k&#937; in each tap: the DRO still reads the scale if an isolator input ever fails short.</text>
  <text x="46" y="682" font-size="11.5" fill="#37474F">- The DRO works with the controller switched off. With the DRO off, both outputs sit low (L version).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
